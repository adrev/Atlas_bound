name: CI Quality Gates

# Runs on every push to main and on PRs. Acts as a quality gate
# (lint, types, tests, audit). Candidate deploys are manual via
# `./deploy.sh`: existing configuration and Secret Manager references
# are preserved, images are pinned, and no traffic is promoted.
# Environment/secret changes require explicit reviewed updates, not
# replacement from local .env files. Promotion is a separate decision.
# Main's legacy resource adoption additionally requires a reviewed
# quiescent cutover; no-traffic alone does not isolate the database.
#
# To re-enable automated deploys later:
#   1. Configure Workload Identity Federation on GCP.
#   2. Add WIF_PROVIDER + WIF_SERVICE_ACCOUNT as repo secrets.
#   3. Retain the same candidate identity/configuration/traffic checks.
#   4. Use reviewed Secret Manager references for intentional secret
#      updates, and retain manual promotion and data-migration gates.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: atlas-ci-only
          POSTGRES_DB: atlas_scale_zero
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ATLAS_RUNTIME_TEST_DATABASE_URL: postgresql://postgres:atlas-ci-only@127.0.0.1:5432/atlas_scale_zero
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build shared package
        run: npm run build --workspace=shared

      - name: Type check (server)
        run: npx tsc --noEmit --project server/tsconfig.json

      - name: Type check (client)
        run: npx tsc --noEmit --project client/tsconfig.json

      - name: Test
        run: npm test

      - name: Chronicle worker protocol tests
        run: node --test dgx-worker/worker.test.mjs

      - name: Security audit
        run: npm audit --audit-level=moderate
